# Blueprint opcional do Render (New > Blueprint). Se preferir, crie os serviços manualmente (veja o README).
databases:
  - name: oficina-db
    databaseName: oficina_tech
    user: oficina
    plan: free

services:
  - type: web
    name: oficina-tech
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oficina-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: ADMIN_WHATSAPP
        sync: false
